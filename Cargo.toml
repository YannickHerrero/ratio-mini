[package]
name = "ratio-mini"
version = "0.2.0"
edition = "2024"
default-run = "ratio-mini"

[features]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "ratio-mini-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"], optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
strip = true
lto = true
